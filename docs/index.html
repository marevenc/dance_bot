<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь группы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        h1 { margin-top: 40px; }
        .info { margin-top: 20px; padding: 15px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 10px; }
    </style>
</head>
<body>
    <h1>📅 Календарь</h1>
    <p>Mini App успешно загружен!</p>
    <div class="info" id="user-info">Загрузка данных пользователя...</div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем данные пользователя (передаются Telegram автоматически)
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-info').innerHTML =
                `Привет, <b>${user.first_name}</b>!<br>` +
                `Твой ID: ${user.id}`;
        } else {
            document.getElementById('user-info').textContent =
                'Данные пользователя недоступны (откройте через Telegram).';
        }
    </script>
</body>
</html>
